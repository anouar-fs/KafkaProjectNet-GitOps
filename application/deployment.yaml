apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafkaprojectnet
  labels:
    app: kafkaprojectnet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kafkaprojectnet
  template:
    metadata:
      labels:
        app: kafkaprojectnet
    spec:
      containers:
        - name: kafkaprojectnet
          image: ghcr.io/anouar-fs/kafkaprojectnet:sha-06e84e9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
